const SESION = "roicos-clave-Finocam-Amazon";
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function descifrar(clave) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const llave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(D.s), iterations: D.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(D.i) }, llave, bytes(D.d));
  if (!D.z) return new TextDecoder().decode(claro);
  const flujo = new Blob([claro]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new TextDecoder().decode(await new Response(flujo).arrayBuffer());
}
function leerSesion() { try { return SESION ? sessionStorage.getItem(SESION) : null; } catch (e) { return null; } }
function guardarSesion(v) { try { if (SESION) { v ? sessionStorage.setItem(SESION, v) : sessionStorage.removeItem(SESION); } } catch (e) {} }
function mostrar(html) { document.open(); document.write(html); document.close(); }
const form = document.getElementById("acceso"), campo = document.getElementById("clave"), boton = document.getElementById("entrar"), error = document.getElementById("error");
function esperando(si) { boton.disabled = si; boton.textContent = si ? "Abriendo…" : "Ver informe"; }
form.addEventListener("submit", async ev => {
  ev.preventDefault();
  esperando(true); error.hidden = true;
  let html;
  try { html = await descifrar(campo.value); }
  catch (e) { error.hidden = false; esperando(false); campo.select(); return; }
  guardarSesion(campo.value);
  mostrar(html);
});
(async () => {
  const guardada = leerSesion();
  if (!guardada) return;
  esperando(true);
  try { mostrar(await descifrar(guardada)); }
  catch (e) { guardarSesion(null); esperando(false); }
})();
})();
